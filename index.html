<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumera Host</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f5f9;--paper:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#1e3a8a;--blue2:#2563eb;--soft:#eff6ff;--green:#059669;--danger:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,textarea{font:inherit}
.hidden{display:none!important}
#auth-screen{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
@media(max-width:860px){#auth-screen{grid-template-columns:1fr}.auth-side{order:-1;min-height:180px}}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:36px 20px}
.auth-box{width:100%;max-width:390px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue2);font-weight:700;margin-bottom:8px}
.auth-box h1{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.lead{color:var(--muted);font-size:.92rem;line-height:1.7;margin-bottom:22px}
.switch{display:inline-flex;background:#e8eef6;border-radius:10px;padding:3px;margin-bottom:18px}
.switch button{border:0;background:transparent;padding:8px 16px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px;color:#334155}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:0}
.field input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}
.btn-main{width:100%;background:var(--blue);color:#fff}
.btn-main:hover{background:#172554}
.btn-main:disabled{opacity:.55;cursor:wait}
.btn-green{background:var(--green);color:#fff}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:#fff;border:1px solid #fecaca;color:var(--danger)}
.msg{margin-top:12px;font-size:.88rem;min-height:1.2em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--green)}
.auth-side{background:#0b1b3a;color:#e8eefc;padding:40px 32px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-100px;bottom:-120px;background:radial-gradient(circle,rgba(59,130,246,.35),transparent 70%)}
.auth-side .mark{position:relative;z-index:1;font-size:12px;opacity:.7;letter-spacing:.12em;margin-bottom:14px}
.auth-side h2{position:relative;z-index:1;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.3;max-width:11ch}
.auth-side p{position:relative;z-index:1;margin-top:14px;opacity:.8;line-height:1.7;max-width:30ch;font-size:.92rem}
.auth-side .foot{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.auth-side .foot span{border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:999px;font-size:.75rem}
#app-screen{display:none;min-height:100vh;flex-direction:column}
#app-screen.show{display:flex}
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;color:var(--blue);display:flex;gap:8px;align-items:center}
.brand b{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px}
.menu-wrap{position:relative}
.menu-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.dropdown{position:absolute;left:0;top:calc(100%+6px);width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.1);padding:8px}
.dropdown .who{padding:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dropdown .who strong{display:block;font-size:.9rem}
.dropdown .who span{color:var(--muted);font-size:.78rem}
.dropdown button{width:100%;text-align:right;border:0;background:transparent;padding:9px;border-radius:8px;cursor:pointer}
.dropdown button:hover{background:var(--soft)}
.content{width:min(900px,100%);margin:0 auto;padding:24px 16px 48px;flex:1}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-bottom:22px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin-bottom:6px;font-size:1.02rem}
.card p{color:var(--muted);font-size:.88rem;line-height:1.6;margin-bottom:12px}
.plans{display:grid;gap:8px}
.plan{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fafafa}
.plan strong{font-size:.92rem}.plan span{font-size:.78rem;color:var(--muted)}
.tag{font-size:.7rem;background:var(--soft);color:var(--blue2);padding:3px 7px;border-radius:6px;font-weight:600}
.section-h{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:700}
.plist{display:grid;gap:8px}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px}
.prow .n{font-weight:700}.prow .s{font-size:.75rem;color:var(--muted);direction:ltr;text-align:left;margin-top:2px;word-break:break-all}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap}
.ws-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:14px}
.linkbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--soft);border:1px solid #dbeafe;padding:8px;border-radius:10px;direction:ltr}
.linkbar code{font-size:.78rem;color:var(--blue);word-break:break-all;flex:1;min-width:120px}
.flist{display:grid;gap:8px;margin:10px 0}
.frow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.frow .fn{font-weight:600;direction:ltr;text-align:left}
.frow .acts{display:flex;gap:5px;flex-wrap:wrap}
.drop{border:1.5px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;background:#fafafa;margin-top:10px}
.drop.on{border-color:var(--blue2);background:var(--soft)}
.drop input{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:12px}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:16px}
.modal h3{margin-bottom:10px}
.modal textarea{width:100%;min-height:250px;border:1px solid var(--line);border-radius:10px;padding:10px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.modal-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#view-screen{display:none;position:fixed;inset:0;z-index:100;background:#fff}
#view-screen.show{display:block}
.view-bar{height:34px;background:#0f172a;color:#e2e8f0;font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;direction:ltr}
#view-frame{width:100%;height:calc(100% - 34px);border:0}
</style>
</head>
<body>
<section id="auth-screen">
  <div class="auth-form-wrap">
    <div class="auth-box">
      <div class="eyebrow">Lumera Studio</div>
      <h1>ورود به Host</h1>
      <p class="lead">ایمیل و رمز بزن — بدون کد تأیید ایمیل. فایل وب بگذار و لینک عمومی بگیر.</p>
      <div class="switch">
        <button type="button" class="on" id="tab-login">ورود</button>
        <button type="button" id="tab-signup">ثبت‌نام</button>
      </div>
      <form id="auth-form">
        <div class="field"><label>ایمیل</label><input id="auth-email" type="email" dir="ltr" required placeholder="you@email.com"></div>
        <div class="field"><label>رمز عبور</label><input id="auth-pass" type="password" dir="ltr" required minlength="6" placeholder="حداقل ۶ کاراکتر"></div>
        <div class="field hidden" id="pass2-wrap"><label>تکرار رمز</label><input id="auth-pass2" type="password" dir="ltr" minlength="6"></div>
        <button class="btn btn-main" type="submit" id="auth-submit">ورود</button>
        <div class="msg" id="auth-msg"></div>
      </form>
    </div>
  </div>
  <aside class="auth-side">
    <div>
      <div class="mark">LUMERA HOST</div>
      <h2>میزبانی ساده صفحات وب</h2>
      <p>پروژه بساز، HTML بگذار، لینک بگیر. بدون ارسال کد به ایمیل.</p>
    </div>
    <div class="foot"><span>آپلود</span><span>ویرایش</span><span>لینک عمومی</span></div>
  </aside>
</section>

<section id="app-screen">
  <header class="topbar">
    <div class="brand"><b>LH</b> Lumera Host</div>
    <div class="menu-wrap">
      <button type="button" class="menu-btn" id="menu-btn">⋮</button>
      <div class="dropdown hidden" id="menu-drop">
        <div class="who"><strong id="menu-name">کاربر</strong><span id="menu-email"></span></div>
        <button type="button" id="menu-projects">پروژه‌ها</button>
        <button type="button" id="menu-logout">خروج</button>
      </div>
    </div>
  </header>
  <main class="content" id="main-content"></main>
</section>

<section id="view-screen">
  <div class="view-bar"><span id="view-label">Lumera Host</span><a href="#" id="view-home" style="color:#93c5fd">Home</a></div>
  <iframe id="view-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</section>

<script>
(function () {
  var URL = 'https://cnvxbwdjuwczowaqgmia.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNudnhid2RqdXdjem93YXFnbWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzE5NDQsImV4cCI6MjEwNjUwNzk0NH0.OB5lXXhHQXdnHlJU5azIuHHZ8G339BSNl4aieTDKeX8';

  if (!window.supabase || !window.supabase.createClient) {
    document.body.innerHTML = '<p style="padding:2rem;direction:rtl;font-family:Tahoma">کتابخانه لود نشد. اینترنت را چک کن.</p>';
    return;
  }

  var sb = window.supabase.createClient(URL, KEY, {
    global: { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }
  });

  var SK = 'lh_user_v2';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var authScreen = $('#auth-screen');
  var appScreen = $('#app-screen');
  var viewScreen = $('#view-screen');
  var main = $('#main-content');
  var mode = 'login';
  var user = null;
  var currentProject = null;

  function saveUser(u) {
    user = u;
    if (u) localStorage.setItem(SK, JSON.stringify(u));
    else localStorage.removeItem(SK);
  }
  function loadUser() {
    try { user = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { user = null; }
    return user;
  }

  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  async function passHash(email, pass) {
    return sha256(String(email).toLowerCase().trim() + '|' + pass + '|lumera-host-v2');
  }

  function publicBase() {
    return location.origin + location.pathname.replace(/index\.html$/i, '');
  }
  function projectUrl(slug) { return publicBase() + '?p=' + encodeURIComponent(slug); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  async function tryPublicView() {
    var slug = new URLSearchParams(location.search).get('p');
    if (!slug) return false;
    authScreen.classList.add('hidden');
    appScreen.classList.remove('show');
    viewScreen.classList.add('show');
    $('#view-label').textContent = 'Lumera Host · ' + slug;
    $('#view-home').href = publicBase();
    try {
      var res = await sb.from('host_projects').select('id,name,slug').eq('slug', slug).maybeSingle();
      if (res.error || !res.data) {
        document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:Tahoma;direction:rtl"><h2>پروژه پیدا نشد</h2></div>';
        return true;
      }
      var fr = await sb.from('host_files').select('filename,content').eq('project_id', res.data.id);
      var list = fr.data || [];
      var htmlFile = list.find(function (f) { return /^index\.html$/i.test(f.filename); })
        || list.find(function (f) { return /\.html$/i.test(f.filename); }) || list[0];
      if (!htmlFile) {
        $('#view-frame').srcdoc = '<p style="padding:2rem;font-family:Tahoma;direction:rtl">فایلی نیست</p>';
        return true;
      }
      var body = htmlFile.content || '';
      var css = list.filter(function (f) { return /\.css$/i.test(f.filename); });
      if (css.length && !/<link[^>]+stylesheet/i.test(body)) {
        var styles = css.map(function (c) { return '<style>' + c.content + '</style>'; }).join('\n');
        if (/<\/head>/i.test(body)) body = body.replace(/<\/head>/i, styles + '</head>');
        else body = styles + body;
      }
      $('#view-frame').srcdoc = body;
    } catch (e) {
      console.error(e);
      $('#view-frame').srcdoc = '<p style="padding:2rem;direction:rtl;font-family:Tahoma">خطا در بارگذاری</p>';
    }
    return true;
  }

  function setMode(m) {
    mode = m;
    $('#tab-login').classList.toggle('on', m === 'login');
    $('#tab-signup').classList.toggle('on', m === 'signup');
    $('#pass2-wrap').classList.toggle('hidden', m === 'login');
    $('#auth-submit').textContent = m === 'login' ? 'ورود' : 'ثبت‌نام';
    $('#auth-msg').textContent = '';
    $('#auth-msg').className = 'msg';
  }
  $('#tab-login').onclick = function () { setMode('login'); };
  $('#tab-signup').onclick = function () { setMode('signup'); };

  $('#auth-form').onsubmit = async function (e) {
    e.preventDefault();
    var email = $('#auth-email').value.trim().toLowerCase();
    var pass = $('#auth-pass').value;
    var msg = $('#auth-msg');
    var btn = $('#auth-submit');
    msg.className = 'msg';
    if (!email || !pass) { msg.className = 'msg err'; msg.textContent = 'ایمیل و رمز لازم است'; return; }
    btn.disabled = true;
    msg.textContent = 'صبر کنید...';
    try {
      var hash = await passHash(email, pass);
      var data;
      if (mode === 'signup') {
        if (pass !== $('#auth-pass2').value) throw new Error('تکرار رمز اشتباه است');
        if (pass.length < 6) throw new Error('رمز حداقل ۶ کاراکتر');
        var reg = await sb.rpc('host_register', { p_email: email, p_hash: hash, p_name: email.split('@')[0] });
        if (reg.error) throw reg.error;
        data = reg.data;
      } else {
        var log = await sb.rpc('host_login', { p_email: email, p_hash: hash });
        if (log.error) throw log.error;
        data = log.data;
      }
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (_) {}
      }
      if (!data || data.ok === false) throw new Error((data && data.error) || 'خطا در احراز هویت');
      saveUser(data.user);
      bootApp();
    } catch (err) {
      console.error(err);
      msg.className = 'msg err';
      var t = (err && err.message) || 'خطا';
      if (/Could not find the function|PGRST202|404|does not exist/i.test(t)) {
        t = 'SQL جدید را در Supabase هنوز Run نکردی. از فایل SQL.sql نسخه جدید استفاده کن.';
      }
      if (/gen_salt/i.test(t)) t = 'SQL قدیمی است. SQL جدید را کامل Run کن.';
      msg.textContent = t;
    } finally {
      btn.disabled = false;
    }
  };

  $('#menu-btn').onclick = function (e) {
    e.stopPropagation();
    $('#menu-drop').classList.toggle('hidden');
  };
  document.addEventListener('click', function () { $('#menu-drop').classList.add('hidden'); });
  $('#menu-logout').onclick = function () {
    saveUser(null); currentProject = null;
    appScreen.classList.remove('show'); authScreen.classList.remove('hidden');
  };
  $('#menu-projects').onclick = function () { currentProject = null; renderDashboard(); };

  function bootApp() {
    if (!user) return;
    authScreen.classList.add('hidden');
    appScreen.classList.add('show');
    $('#menu-name').textContent = user.display_name || (user.email || '').split('@')[0];
    $('#menu-email').textContent = user.email || '';
    renderDashboard();
  }

  function slugify(name) {
    var base = String(name || 'project').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 36) || 'project';
    return base + '-' + Math.random().toString(36).slice(2, 7);
  }

  async function renderDashboard() {
    currentProject = null;
    var limit = (user && user.project_limit) || 1;
    var plan = (user && user.plan) || 'free';
    var pr = await sb.from('host_projects').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    var list = pr.data || [];

    main.innerHTML =
      '<div class="grid2"><div class="card"><h3>پروژه جدید</h3><p>HTML بگذار و لینک بگیر. پلن: <b>' + esc(plan) + '</b> — سقف ' + limit + '</p>' +
      '<button type="button" class="btn btn-green" id="btn-new">+ پروژه جدید</button></div>' +
      '<div class="card"><h3>خرید اشتراک</h3><p>پرداخت فعلاً فعال نیست.</p><div class="plans">' +
      '<div class="plan"><div><strong>۱۰۰٬۰۰۰ ت</strong><br><span>۵ پروژه</span></div><span class="tag">به‌زودی</span></div>' +
      '<div class="plan"><div><strong>۲۹۹٬۰۰۰ ت</strong><br><span>۱۰ پروژه</span></div><span class="tag">به‌زودی</span></div>' +
      '<div class="plan"><div><strong>۹۹۹٬۰۰۰ ت</strong><br><span>نامحدود</span></div><span class="tag">به‌زودی</span></div>' +
      '</div></div></div>' +
      '<div class="section-h"><span>پروژه‌های من</span><span style="color:var(--muted);font-weight:500;font-size:.85rem">' + list.length + ' / ' + limit + '</span></div>' +
      '<div class="plist" id="plist"></div>';

    var box = $('#plist');
    if (!list.length) box.innerHTML = '<div class="empty">هنوز پروژه‌ای نداری.</div>';
    else {
      box.innerHTML = list.map(function (p) {
        return '<div class="prow" data-id="' + p.id + '"><div><div class="n">' + esc(p.name) + '</div><div class="s">' + esc(projectUrl(p.slug)) + '</div></div>' +
          '<div class="acts"><button type="button" class="btn btn-soft btn-open">باز کردن</button>' +
          '<button type="button" class="btn btn-soft btn-copy">کپی لینک</button>' +
          '<button type="button" class="btn btn-danger btn-del">حذف</button></div></div>';
      }).join('');
      box.querySelectorAll('.prow').forEach(function (row) {
        var p = list.find(function (x) { return x.id === row.getAttribute('data-id'); });
        row.querySelector('.btn-open').onclick = function () { openProject(p); };
        row.querySelector('.btn-copy').onclick = async function () {
          try { await navigator.clipboard.writeText(projectUrl(p.slug)); alert('کپی شد'); }
          catch (e) { prompt('لینک', projectUrl(p.slug)); }
        };
        row.querySelector('.btn-del').onclick = async function () {
          if (!confirm('حذف پروژه؟')) return;
          await sb.from('host_files').delete().eq('project_id', p.id);
          await sb.from('host_projects').delete().eq('id', p.id);
          renderDashboard();
        };
      });
    }

    $('#btn-new').onclick = async function () {
      if (list.length >= limit && limit < 9999) { alert('سقف پروژه پر است'); return; }
      var name = prompt('نام پروژه', 'my-site');
      if (!name) return;
      var slug = slugify(name);
      var ins = await sb.from('host_projects').insert({ user_id: user.id, name: name.trim(), slug: slug }).select().single();
      if (ins.error) { alert(ins.error.message); return; }
      var starter = '<!DOCTYPE html>\n<html lang="fa" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + esc(name) + '</title>\n<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,sans-serif;background:#f3f5f9;color:#0f172a}.box{background:#fff;padding:2rem;border-radius:12px;border:1px solid #e2e8f0;text-align:center}h1{margin:0 0 .4rem;font-size:1.3rem}p{margin:0;color:#64748b}</style>\n</head>\n<body>\n<div class="box"><h1>' + esc(name) + '</h1><p>روی Lumera Host</p></div>\n</body>\n</html>';
      await sb.from('host_files').insert({ project_id: ins.data.id, filename: 'index.html', content: starter });
      openProject(ins.data);
    };
  }

  async function openProject(p) {
    currentProject = p;
    var fr = await sb.from('host_files').select('*').eq('project_id', p.id).order('filename');
    var list = fr.data || [];
    var url = projectUrl(p.slug);
    main.innerHTML =
      '<div class="ws-head"><div><button type="button" class="btn btn-soft" id="back">→ داشبورد</button>' +
      '<h2 style="margin-top:8px;font-size:1.2rem">' + esc(p.name) + '</h2></div>' +
      '<div class="linkbar"><code>' + esc(url) + '</code>' +
      '<button type="button" class="btn btn-main" id="copy" style="width:auto;padding:8px 12px">کپی</button>' +
      '<a class="btn btn-soft" href="' + url + '" target="_blank" rel="noopener" style="width:auto">باز کردن</a></div></div>' +
      '<div class="card"><h3>فایل‌ها</h3><p style="color:var(--muted);font-size:.88rem;margin-bottom:8px">آپلود / ویرایش / جایگزین / حذف</p>' +
      '<div class="flist" id="flist"></div>' +
      '<div class="drop" id="drop"><div style="font-weight:700">آپلود فایل</div>' +
      '<div style="color:var(--muted);font-size:.82rem;margin-top:4px">HTML CSS JS TXT</div>' +
      '<input type="file" id="fin" multiple accept=".html,.htm,.css,.js,.txt,.json,.svg,.md,text/*"></div>' +
      '<div style="margin-top:10px"><button type="button" class="btn btn-soft" id="newf">+ فایل جدید</button></div></div>';

    $('#back').onclick = function () { renderDashboard(); };
    $('#copy').onclick = async function () {
      try { await navigator.clipboard.writeText(url); alert('کپی شد'); } catch (e) { prompt('لینک', url); }
    };

    var fl = $('#flist');
    function paint(items) {
      if (!items.length) { fl.innerHTML = '<div class="empty">فایلی نیست</div>'; return; }
      fl.innerHTML = items.map(function (f) {
        return '<div class="frow" data-id="' + f.id + '"><div class="fn">' + esc(f.filename) + '</div><div class="acts">' +
          '<button type="button" class="btn btn-soft btn-ed">ویرایش</button>' +
          '<button type="button" class="btn btn-soft btn-rp">جایگزین</button>' +
          '<button type="button" class="btn btn-danger btn-rm">حذف</button></div></div>';
      }).join('');
      fl.querySelectorAll('.frow').forEach(function (row) {
        var f = items.find(function (x) { return x.id === row.getAttribute('data-id'); });
        row.querySelector('.btn-ed').onclick = function () { openEditor(f); };
        row.querySelector('.btn-rm').onclick = async function () {
          if (!confirm('حذف؟')) return;
          await sb.from('host_files').delete().eq('id', f.id);
          openProject(p);
        };
        row.querySelector('.btn-rp').onclick = function () {
          var inp = document.createElement('input');
          inp.type = 'file';
          inp.onchange = async function () {
            var file = inp.files && inp.files[0];
            if (!file) return;
            var text = await file.text();
            await sb.from('host_files').update({ content: text, filename: file.name || f.filename, updated_at: new Date().toISOString() }).eq('id', f.id);
            openProject(p);
          };
          inp.click();
        };
      });
    }
    paint(list);

    var drop = $('#drop'), fin = $('#fin');
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('on'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('on'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('on');
      if (e.dataTransfer.files) uploadFiles(e.dataTransfer.files, list);
    });
    fin.onchange = function () { uploadFiles(fin.files, list); };

    async function uploadFiles(fileList, existing) {
      var arr = Array.from(fileList || []);
      for (var i = 0; i < arr.length; i++) {
        var file = arr[i];
        var text = await file.text();
        var filename = file.name || 'file.txt';
        var found = existing.find(function (f) { return f.filename === filename; });
        if (found) await sb.from('host_files').update({ content: text, updated_at: new Date().toISOString() }).eq('id', found.id);
        else await sb.from('host_files').insert({ project_id: p.id, filename: filename, content: text });
      }
      openProject(p);
    }

    $('#newf').onclick = async function () {
      var filename = prompt('نام فایل', 'page.html');
      if (!filename) return;
      var content = /\.html?$/i.test(filename) ? '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>New</title></head><body><h1>Hello</h1></body></html>' : '';
      await sb.from('host_files').insert({ project_id: p.id, filename: filename, content: content });
      openProject(p);
    };
  }

  function openEditor(file) {
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal"><h3>ویرایش فایل</h3>' +
      '<div class="field"><label>نام فایل</label><input id="ed-name" dir="ltr" value="' + esc(file.filename) + '"></div>' +
      '<div class="field"><label>محتوا</label><textarea id="ed-body" spellcheck="false"></textarea></div>' +
      '<div class="modal-actions"><button type="button" class="btn btn-main" id="ed-save" style="width:auto">ذخیره</button>' +
      '<button type="button" class="btn btn-soft" id="ed-cancel" style="width:auto">بستن</button></div></div>';
    document.body.appendChild(back);
    back.querySelector('#ed-body').value = file.content || '';
    back.querySelector('#ed-cancel').onclick = function () { back.remove(); };
    back.onclick = function (e) { if (e.target === back) back.remove(); };
    back.querySelector('#ed-save').onclick = async function () {
      var filename = back.querySelector('#ed-name').value.trim();
      var content = back.querySelector('#ed-body').value;
      if (!filename) { alert('نام فایل لازم است'); return; }
      var u = await sb.from('host_files').update({ filename: filename, content: content, updated_at: new Date().toISOString() }).eq('id', file.id);
      if (u.error) { alert(u.error.message); return; }
      back.remove();
      if (currentProject) openProject(currentProject);
    };
  }

  (async function () {
    if (await tryPublicView()) return;
    if (loadUser()) bootApp();
  })();
})();
</script>
</body>
</html>
